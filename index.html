<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap');

        :root {
            --bg: #f5f0e8;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-light: #4a4a4a;
            --accent: #ff5722;
            --accent-secondary: #ffeb3b;
            --accent-tertiary: #4caf50;
            --border: #1a1a1a;
            --shadow-offset: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1.5rem 2rem;
            background: var(--accent);
            border-bottom: 4px solid var(--border);
        }

        header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        header p {
            font-family: 'Space Mono', monospace;
            color: var(--text);
            font-size: 1rem;
            font-weight: 400;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Category Filter */
        .filters {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            border: 3px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border);
        }

        .filter-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: calc(var(--shadow-offset) + 2px) calc(var(--shadow-offset) + 2px) 0 var(--border);
        }

        .filter-btn:active {
            transform: translate(2px, 2px);
            box-shadow: calc(var(--shadow-offset) - 2px) calc(var(--shadow-offset) - 2px) 0 var(--border);
        }

        .filter-btn.active {
            background: var(--accent-secondary);
            color: var(--text);
        }

        /* Category Section */
        .category-section {
            margin-bottom: 3.5rem;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 4px solid var(--border);
        }

        .category-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--accent-secondary);
            border: 3px solid var(--border);
            box-shadow: 3px 3px 0 var(--border);
        }

        .category-header h2 {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
        }

        .category-count {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-left: auto;
        }

        /* Recipe Grid */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .recipe-card {
            background: var(--card);
            cursor: pointer;
            transition: all 0.1s ease;
            border: 3px solid var(--border);
            position: relative;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border);
            display: flex;
            flex-direction: column;
        }

        .recipe-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: calc(var(--shadow-offset) + 4px) calc(var(--shadow-offset) + 4px) 0 var(--border);
        }

        .recipe-card:active {
            transform: translate(2px, 2px);
            box-shadow: calc(var(--shadow-offset) - 2px) calc(var(--shadow-offset) - 2px) 0 var(--border);
        }

        .recipe-image {
            height: 180px;
            border-bottom: 3px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .recipe-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-card-content {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .recipe-card .category {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            background: var(--accent-secondary);
            padding: 0.2rem 0.4rem;
            border: 2px solid var(--border);
            margin-bottom: 0.75rem;
            font-weight: 700;
            align-self: flex-start;
        }

        .recipe-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .recipe-card .description {
            font-size: 0.85rem;
            color: var(--text-light);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .recipe-card .recipe-meta {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 2px dashed var(--border);
        }

        .recipe-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-light);
            background: var(--bg);
            padding: 0.2rem 0.4rem;
            border: 1px solid var(--border);
        }

        /* Featured Recipe */
        .featured-section {
            margin-bottom: 3rem;
        }

        .featured-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--card);
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0 var(--border);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .featured-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 var(--border);
        }

        .featured-image {
            height: 300px;
            border-right: 4px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .featured-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .featured-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
            background: var(--accent);
            padding: 0.4rem 0.75rem;
            border: 2px solid var(--border);
            box-shadow: 2px 2px 0 var(--border);
        }

        .featured-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .featured-content .category {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            background: var(--accent-secondary);
            padding: 0.25rem 0.5rem;
            border: 2px solid var(--border);
            margin-bottom: 1rem;
            font-weight: 700;
            align-self: flex-start;
        }

        .featured-content h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .featured-content .description {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .featured-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .featured-card {
                grid-template-columns: 1fr;
            }

            .featured-image {
                height: 200px;
                border-right: none;
                border-bottom: 4px solid var(--border);
            }

            .featured-content {
                padding: 1.5rem;
            }

            .featured-content h3 {
                font-size: 1.35rem;
            }
        }

        /* Recipe Page (Full Page View) */
        .recipe-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 1000;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
        }

        .recipe-page.active {
            opacity: 1;
            visibility: visible;
        }

        .recipe-hero {
            position: relative;
            height: 50vh;
            min-height: 350px;
            max-height: 500px;
            overflow: hidden;
            border-bottom: 4px solid var(--border);
        }

        .recipe-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3rem 2rem 2rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }

        .recipe-hero .category {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            background: var(--accent-secondary);
            padding: 0.35rem 0.6rem;
            border: 2px solid var(--border);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .recipe-hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            text-shadow: 2px 2px 0 var(--border);
        }

        .back-btn {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border: 3px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0 var(--border);
        }

        .back-btn:hover {
            background: var(--accent);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        .recipe-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
        }

        .recipe-description {
            font-size: 1.15rem;
            color: var(--text-light);
            margin-bottom: 2.5rem;
            line-height: 1.7;
            padding-bottom: 2rem;
            border-bottom: 3px dashed var(--border);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 3rem;
        }

        @media (max-width: 768px) {
            .recipe-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .recipe-hero h1 {
                font-size: 1.75rem;
            }

            .recipe-hero {
                height: 40vh;
                min-height: 280px;
            }
        }

        .recipe-section-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            background: var(--accent);
            padding: 0.6rem 1rem;
            border: 3px solid var(--border);
            margin-bottom: 1.25rem;
            font-weight: 700;
            display: inline-block;
            box-shadow: 3px 3px 0 var(--border);
        }

        .ingredients-list {
            list-style: none;
            border: 3px solid var(--border);
            background: var(--card);
            box-shadow: 5px 5px 0 var(--border);
        }

        .ingredients-list li {
            padding: 0.875rem 1.25rem;
            border-bottom: 2px solid var(--border);
            font-size: 0.95rem;
        }

        .ingredients-list li:last-child {
            border-bottom: none;
        }

        .instructions-list {
            list-style: none;
            counter-reset: step;
        }

        .instructions-list li {
            padding: 1.25rem 0;
            padding-left: 4rem;
            position: relative;
            border-bottom: 2px dashed var(--border);
            font-size: 1rem;
            line-height: 1.6;
        }

        .instructions-list li:last-child {
            border-bottom: none;
        }

        .instructions-list li::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            top: 1rem;
            width: 2.75rem;
            height: 2.75rem;
            background: var(--accent-secondary);
            color: var(--text);
            border: 3px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 3px 3px 0 var(--border);
        }

        .recipe-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 3px dashed var(--border);
        }

        .source-link {
            display: inline-block;
            padding: 0.875rem 1.5rem;
            background: var(--bg);
            color: var(--text);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            border: 3px solid var(--border);
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0 var(--border);
        }

        .source-link:hover {
            background: var(--accent-secondary);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .recipe-meta {
            margin-top: 2rem;
            padding: 1.25rem;
            border: 3px solid var(--border);
            background: var(--card);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--text);
            box-shadow: 4px 4px 0 var(--border);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
            font-family: 'Space Mono', monospace;
        }

        /* Cook Mode Button */
        .cook-mode-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            margin-right: 0.75rem;
            padding: 0.875rem 1.5rem;
            background: var(--accent);
            color: var(--text);
            border: 3px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0 var(--border);
        }

        .cook-mode-btn:hover {
            background: var(--accent-secondary);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .cook-mode-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--border);
        }

        .cook-mode-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Cook Mode Overlay */
        .cook-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .cook-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cook-header {
            padding: 1.5rem 2rem;
            background: var(--accent-tertiary);
            border-bottom: 4px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .cook-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cook-exit-btn {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            background: var(--card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            transition: all 0.1s ease;
            box-shadow: 3px 3px 0 var(--border);
        }

        .cook-exit-btn:hover {
            background: var(--accent);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--border);
        }

        .cook-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .cook-progress {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Voice Control Buttons */
        .cook-voice-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1rem;
        }

        .cook-voice-btn {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            background: var(--card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--text);
            transition: all 0.1s ease;
            box-shadow: 3px 3px 0 var(--border);
            position: relative;
        }

        .cook-voice-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--border);
        }

        .cook-voice-btn.active {
            background: var(--accent);
        }

        .cook-voice-btn.listening {
            background: var(--accent);
            animation: pulse-mic 1.5s ease-in-out infinite;
        }

        @keyframes pulse-mic {
            0%, 100% { box-shadow: 3px 3px 0 var(--border); }
            50% { box-shadow: 3px 3px 0 var(--border), 0 0 0 8px rgba(255, 87, 34, 0.3); }
        }

        .cook-voice-btn.speaking {
            background: var(--accent-secondary);
        }

        .cook-voice-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Voice Commands Panel */
        .voice-commands-panel {
            position: fixed;
            bottom: 6.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 3px solid var(--border);
            box-shadow: 4px 4px 0 var(--border);
            padding: 0.75rem 1.25rem;
            display: none;
            align-items: center;
            gap: 1rem;
            z-index: 10;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
        }

        .voice-commands-panel.active {
            display: flex;
        }

        .voice-commands-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        .voice-commands-label svg {
            width: 16px;
            height: 16px;
        }

        .voice-commands-list {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .voice-command {
            padding: 0.35rem 0.6rem;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text-light);
            font-size: 0.75rem;
            transition: all 0.15s ease;
        }

        .voice-command.recognized {
            background: var(--accent-secondary);
            color: var(--text);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .voice-commands-panel {
                left: 1rem;
                right: 1rem;
                transform: none;
                bottom: 5.5rem;
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.6rem 1rem;
            }

            .voice-commands-list {
                justify-content: center;
            }

            .cook-voice-controls {
                margin-left: 0.5rem;
            }

            .cook-voice-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
        }

        .cook-progress-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--text);
            font-weight: 700;
            text-transform: uppercase;
        }

        .cook-progress-bar {
            width: 150px;
            height: 12px;
            background: var(--card);
            border: 3px solid var(--border);
            overflow: hidden;
        }

        .cook-progress-fill {
            height: 100%;
            background: var(--accent-secondary);
            transition: width 0.3s ease;
        }

        .cook-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cook-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .cook-step-container {
            max-width: 750px;
            width: 100%;
            text-align: center;
        }

        .cook-step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            background: var(--accent-secondary);
            color: var(--text);
            border: 4px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            box-shadow: 6px 6px 0 var(--border);
        }

        .cook-step-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            line-height: 1.5;
            color: var(--text);
            font-weight: 500;
            padding: 2rem;
            background: var(--card);
            border: 3px solid var(--border);
            box-shadow: 8px 8px 0 var(--border);
        }

        .cook-step-ingredients {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--card);
            border: 3px solid var(--border);
        }

        .cook-step-ingredients h4 {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .cook-step-ingredients p {
            font-size: 1rem;
            color: var(--text-light);
            line-height: 1.6;
        }

        .cook-nav {
            padding: 1.5rem 2rem;
            background: var(--card);
            border-top: 4px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .cook-nav-btn {
            padding: 1rem 2rem;
            border: 3px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 4px 4px 0 var(--border);
        }

        .cook-nav-btn:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .cook-nav-btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--border);
        }

        .cook-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cook-nav-btn.primary {
            background: var(--accent);
            color: var(--text);
        }

        .cook-nav-btn.primary:hover:not(:disabled) {
            background: var(--accent-secondary);
        }

        .cook-nav-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Ingredients Panel (toggleable) */
        .cook-ingredients-toggle {
            position: fixed;
            bottom: 7rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border: 3px solid var(--border);
            background: var(--accent-secondary);
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            transition: all 0.1s ease;
            z-index: 10;
        }

        .cook-ingredients-toggle:hover {
            background: var(--accent);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .cook-ingredients-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 380px;
            height: 100%;
            background: var(--card);
            border-left: 4px solid var(--border);
            z-index: 2001;
            transition: right 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .cook-ingredients-panel.active {
            right: 0;
        }

        .cook-ingredients-header {
            padding: 1.5rem;
            background: var(--accent-secondary);
            border-bottom: 4px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cook-ingredients-header h3 {
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
        }

        .cook-ingredients-close {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            background: var(--card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            transition: all 0.1s ease;
            box-shadow: 2px 2px 0 var(--border);
        }

        .cook-ingredients-close:hover {
            background: var(--accent);
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--border);
        }

        .cook-ingredients-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .cook-ingredient-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.1s ease;
            background: var(--card);
        }

        .cook-ingredient-item:hover {
            background: var(--bg);
        }

        .cook-ingredient-item:last-child {
            border-bottom: none;
        }

        .cook-ingredient-item.checked {
            background: var(--bg);
        }

        .cook-ingredient-item.checked span {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .cook-ingredient-checkbox {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            margin-top: 1px;
            font-weight: 700;
        }

        .cook-ingredient-item.checked .cook-ingredient-checkbox {
            background: var(--accent-tertiary);
            color: var(--text);
        }

        .cook-ingredient-item span {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.4;
        }

        /* Complete screen */
        .cook-complete {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .cook-complete.active {
            display: flex;
        }

        .cook-complete-icon {
            width: 7rem;
            height: 7rem;
            background: var(--accent-tertiary);
            color: var(--text);
            border: 4px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 2rem;
            box-shadow: 6px 6px 0 var(--border);
        }

        .cook-complete h2 {
            font-family: 'Space Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
            text-transform: uppercase;
        }

        .cook-complete p {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 2rem;
            max-width: 400px;
        }

        .cook-complete-btn {
            padding: 1rem 2.5rem;
            background: var(--accent);
            color: var(--text);
            border: 3px solid var(--border);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0 var(--border);
        }

        .cook-complete-btn:hover {
            background: var(--accent-secondary);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.75rem;
            }

            .recipes-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                max-height: 95vh;
                box-shadow: 8px 8px 0 var(--border);
            }

            .modal-header, .modal-body {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }

            .cook-header {
                padding: 1rem 1.25rem;
                flex-wrap: wrap;
                gap: 0.75rem;
            }

            .cook-title {
                font-size: 1rem;
            }

            .cook-progress-bar {
                width: 80px;
            }

            .cook-step-number {
                width: 3.5rem;
                height: 3.5rem;
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
                box-shadow: 4px 4px 0 var(--border);
            }

            .cook-step-text {
                font-size: 1.25rem;
                padding: 1.5rem;
                box-shadow: 5px 5px 0 var(--border);
            }

            .cook-nav {
                padding: 1rem 1.25rem;
            }

            .cook-nav-btn {
                padding: 0.875rem 1.25rem;
                font-size: 0.85rem;
                box-shadow: 3px 3px 0 var(--border);
            }

            .cook-ingredients-panel {
                width: 100%;
                right: -100%;
            }

            .cook-ingredients-toggle {
                bottom: 6rem;
                right: 1rem;
                width: 48px;
                height: 48px;
            }

            .cook-complete h2 {
                font-size: 1.75rem;
            }

            .filter-btn {
                padding: 0.6rem 1rem;
                font-size: 0.75rem;
                box-shadow: 4px 4px 0 var(--border);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Recipe Book</h1>
        <p>Simple recipes for everyday cooking</p>
    </header>

    <div class="container">
        <div class="filters" id="filters"></div>
        <div id="featured-section"></div>
        <div id="recipes-container"></div>
    </div>

    <!-- Full Page Recipe View -->
    <div class="recipe-page" id="recipe-page">
        <button class="back-btn" id="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Back
        </button>
        <div class="recipe-hero">
            <img id="recipe-hero-img" src="" alt="">
            <div class="recipe-hero-overlay">
                <div class="category" id="recipe-category"></div>
                <h1 id="recipe-title"></h1>
            </div>
        </div>
        <div class="recipe-content">
            <p class="recipe-description" id="recipe-description"></p>

            <div class="recipe-grid">
                <div class="ingredients-section">
                    <h3 class="recipe-section-title">Ingredients</h3>
                    <ul class="ingredients-list" id="recipe-ingredients"></ul>
                </div>

                <div class="instructions-section">
                    <h3 class="recipe-section-title">Instructions</h3>
                    <ol class="instructions-list" id="recipe-instructions"></ol>

                    <div class="recipe-meta" id="recipe-meta"></div>

                    <div class="recipe-actions">
                        <button class="cook-mode-btn" id="start-cook-mode">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            Start Cook Mode
                        </button>
                        <a class="source-link" id="recipe-source" href="#" target="_blank">View Original Recipe</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cook Mode Overlay -->
    <div class="cook-overlay" id="cook-overlay">
        <div class="cook-header">
            <div class="cook-header-left">
                <button class="cook-exit-btn" id="cook-exit-btn">&times;</button>
                <span class="cook-title" id="cook-recipe-title"></span>
            </div>
            <div class="cook-progress">
                <span class="cook-progress-text" id="cook-progress-text">Step 1 of 5</span>
                <div class="cook-progress-bar">
                    <div class="cook-progress-fill" id="cook-progress-fill"></div>
                </div>
            </div>
            <div class="cook-voice-controls">
                <button class="cook-voice-btn" id="voice-mic-btn" title="Toggle voice commands">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                </button>
                <button class="cook-voice-btn" id="voice-speaker-btn" title="Toggle voice readout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="cook-body">
            <div class="cook-main" id="cook-main">
                <div class="cook-step-container" id="cook-step-container">
                    <div class="cook-step-number" id="cook-step-number">1</div>
                    <p class="cook-step-text" id="cook-step-text"></p>
                </div>

                <div class="cook-complete" id="cook-complete">
                    <div class="cook-complete-icon">&#10003;</div>
                    <h2>All Done!</h2>
                    <p id="cook-complete-message">Your dish is ready to enjoy.</p>
                    <button class="cook-complete-btn" id="cook-complete-btn">Back to Recipe</button>
                </div>
            </div>

            <button class="cook-ingredients-toggle" id="cook-ingredients-toggle" title="View Ingredients">
                &#9776;
            </button>

            <!-- Voice Commands Panel -->
            <div class="voice-commands-panel" id="voice-commands-panel">
                <div class="voice-commands-label">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                    Say:
                </div>
                <div class="voice-commands-list">
                    <span class="voice-command" data-command="next">"Next"</span>
                    <span class="voice-command" data-command="back">"Back"</span>
                    <span class="voice-command" data-command="repeat">"Repeat"</span>
                    <span class="voice-command" data-command="ingredients">"Ingredients"</span>
                </div>
            </div>
        </div>

        <div class="cook-nav" id="cook-nav">
            <button class="cook-nav-btn" id="cook-prev-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                Previous
            </button>
            <button class="cook-nav-btn primary" id="cook-next-btn">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <!-- Ingredients Panel -->
        <div class="cook-ingredients-panel" id="cook-ingredients-panel">
            <div class="cook-ingredients-header">
                <h3>Ingredients</h3>
                <button class="cook-ingredients-close" id="cook-ingredients-close">&times;</button>
            </div>
            <div class="cook-ingredients-list" id="cook-ingredients-list"></div>
        </div>
    </div>

    <script src="recipes.js"></script>
    <script>
        // recipes array is loaded from recipes.js (generated by build.js)
        const recipesById = Object.fromEntries(recipes.map(r => [r.id, r]));


        // Get unique categories
        const categories = ['all', ...new Set(recipes.map(r => r.category))];
        let activeCategory = 'all';

        // Render filters
        function renderFilters() {
            const filtersEl = document.getElementById('filters');
            filtersEl.innerHTML = categories.map(cat =>
                `<button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">${cat}</button>`
            ).join('');
        }

        // Category display info
        const categoryInfo = {
            breakfast: { icon: '🌅', label: 'Breakfast', color: '#ffeb3b' },
            dinner: { icon: '🍽️', label: 'Dinner', color: '#ff5722' },
            desserts: { icon: '🍰', label: 'Desserts', color: '#e91e63' },
            salads: { icon: '🥬', label: 'Salads', color: '#4caf50' },
            snacks: { icon: '🥜', label: 'Snacks', color: '#ff9800' }
        };

        // Render featured recipe
        function renderFeatured() {
            const featuredEl = document.getElementById('featured-section');

            if (activeCategory !== 'all') {
                featuredEl.innerHTML = '';
                return;
            }

            // Pick a featured recipe
            const featured = recipes.find(r => r.id === 1);
            if (!featured) return;

            featuredEl.innerHTML = `
                <div class="featured-section">
                    <div class="featured-card" data-id="${featured.id}">
                        <div class="featured-image">
                            <span class="featured-badge">Featured</span>
                            <img src="${featured.image}" alt="${featured.title}">
                        </div>
                        <div class="featured-content">
                            <div class="category">${featured.category}</div>
                            <h3>${featured.title}</h3>
                            <p class="description">${featured.description}</p>
                            <span class="featured-cta">View Recipe →</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render recipes
        function renderRecipes() {
            const containerEl = document.getElementById('recipes-container');
            const featuredId = 1; // Exclude featured from grid when showing all

            const filtered = activeCategory === 'all'
                ? recipes
                : recipes.filter(r => r.category === activeCategory);

            if (filtered.length === 0) {
                containerEl.innerHTML = '<div class="empty-state">No recipes found in this category.</div>';
                return;
            }

            // If showing all, group by category
            if (activeCategory === 'all') {
                const grouped = {};
                filtered.forEach(recipe => {
                    if (recipe.id === featuredId) return; // Skip featured
                    if (!grouped[recipe.category]) {
                        grouped[recipe.category] = [];
                    }
                    grouped[recipe.category].push(recipe);
                });

                // Order categories
                const categoryOrder = ['breakfast', 'dinner', 'desserts', 'salads', 'snacks'];

                containerEl.innerHTML = categoryOrder
                    .filter(cat => grouped[cat] && grouped[cat].length > 0)
                    .map(cat => {
                        const info = categoryInfo[cat] || { icon: '📌', label: cat };
                        return `
                            <div class="category-section">
                                <div class="category-header">
                                    <div class="category-icon" style="background: ${info.color}">${info.icon}</div>
                                    <h2>${info.label}</h2>
                                    <span class="category-count">${grouped[cat].length} recipe${grouped[cat].length > 1 ? 's' : ''}</span>
                                </div>
                                <div class="recipes-grid">
                                    ${grouped[cat].map(recipe => renderRecipeCard(recipe)).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');
            } else {
                // Single category view
                containerEl.innerHTML = `
                    <div class="recipes-grid">
                        ${filtered.map(recipe => renderRecipeCard(recipe)).join('')}
                    </div>
                `;
            }

            renderFeatured();
        }

        function renderRecipeCard(recipe) {
            return `
                <div class="recipe-card" data-id="${recipe.id}">
                    <div class="recipe-image">
                        <img src="${recipe.image}" alt="${recipe.title}">
                    </div>
                    <div class="recipe-card-content">
                        <div class="category">${recipe.category}</div>
                        <h3>${recipe.title}</h3>
                        <p class="description">${recipe.description}</p>
                    </div>
                </div>
            `;
        }

        // Current recipe being viewed
        let currentRecipeId = null;

        // Open full page recipe view
        function openRecipe(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            currentRecipeId = recipeId;

            document.getElementById('recipe-hero-img').src = recipe.image;
            document.getElementById('recipe-hero-img').alt = recipe.title;
            document.getElementById('recipe-category').textContent = recipe.category;
            document.getElementById('recipe-title').textContent = recipe.title;
            document.getElementById('recipe-description').textContent = recipe.description;

            document.getElementById('recipe-ingredients').innerHTML =
                recipe.ingredients.map(ing => `<li>${ing}</li>`).join('');

            document.getElementById('recipe-instructions').innerHTML =
                recipe.instructions.map(inst => `<li>${inst}</li>`).join('');

            const metaEl = document.getElementById('recipe-meta');
            if (recipe.meta) {
                metaEl.textContent = recipe.meta;
                metaEl.style.display = 'block';
            } else {
                metaEl.style.display = 'none';
            }

            document.getElementById('recipe-source').href = recipe.source;

            document.getElementById('recipe-page').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Scroll to top of recipe page
            document.getElementById('recipe-page').scrollTop = 0;
        }

        // Close recipe page
        function closeRecipe() {
            document.getElementById('recipe-page').classList.remove('active');
            document.body.style.overflow = '';
            currentRecipeId = null;
        }

        // Event listeners
        document.getElementById('filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                activeCategory = e.target.dataset.category;
                renderFilters();
                renderRecipes();
            }
        });

        document.getElementById('recipes-container').addEventListener('click', (e) => {
            const card = e.target.closest('.recipe-card');
            if (card) {
                openRecipe(parseInt(card.dataset.id));
            }
        });

        document.getElementById('featured-section').addEventListener('click', (e) => {
            const card = e.target.closest('.featured-card');
            if (card) {
                openRecipe(parseInt(card.dataset.id));
            }
        });

        document.getElementById('back-btn').addEventListener('click', closeRecipe);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('cook-overlay').classList.contains('active')) {
                    closeCookMode();
                } else if (document.getElementById('recipe-page').classList.contains('active')) {
                    closeRecipe();
                }
            }
        });

        // ==================== COOK MODE ====================
        let currentCookRecipe = null;
        let currentStep = 0;
        let checkedIngredients = new Set();

        function startCookMode(recipeId) {
            currentCookRecipe = recipes.find(r => r.id === recipeId);
            if (!currentCookRecipe) return;

            currentStep = 0;
            checkedIngredients.clear();

            // Close the recipe page
            closeRecipe();

            // Set up the cook mode UI
            document.getElementById('cook-recipe-title').textContent = currentCookRecipe.title;
            renderCookStep();
            renderCookIngredients();

            // Show cook overlay
            document.getElementById('cook-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Hide complete screen, show steps
            document.getElementById('cook-complete').classList.remove('active');
            document.getElementById('cook-step-container').style.display = 'block';
            document.getElementById('cook-nav').style.display = 'flex';
        }

        function closeCookMode() {
            document.getElementById('cook-overlay').classList.remove('active');
            document.getElementById('cook-ingredients-panel').classList.remove('active');
            document.body.style.overflow = '';
            currentCookRecipe = null;
            currentStep = 0;
        }

        function renderCookStep() {
            if (!currentCookRecipe) return;

            const totalSteps = currentCookRecipe.instructions.length;
            const stepText = currentCookRecipe.instructions[currentStep];

            // Update step display
            document.getElementById('cook-step-number').textContent = currentStep + 1;
            document.getElementById('cook-step-text').textContent = stepText;

            // Update progress
            document.getElementById('cook-progress-text').textContent = `Step ${currentStep + 1} of ${totalSteps}`;
            const progressPercent = ((currentStep + 1) / totalSteps) * 100;
            document.getElementById('cook-progress-fill').style.width = `${progressPercent}%`;

            // Update nav buttons
            document.getElementById('cook-prev-btn').disabled = currentStep === 0;

            const nextBtn = document.getElementById('cook-next-btn');
            if (currentStep === totalSteps - 1) {
                nextBtn.innerHTML = `
                    Finish
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                `;
            } else {
                nextBtn.innerHTML = `
                    Next
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                `;
            }
        }

        function renderCookIngredients() {
            if (!currentCookRecipe) return;

            const listEl = document.getElementById('cook-ingredients-list');
            listEl.innerHTML = currentCookRecipe.ingredients.map((ing, idx) => `
                <div class="cook-ingredient-item ${checkedIngredients.has(idx) ? 'checked' : ''}" data-idx="${idx}">
                    <div class="cook-ingredient-checkbox">
                        ${checkedIngredients.has(idx) ? '&#10003;' : ''}
                    </div>
                    <span>${ing}</span>
                </div>
            `).join('');
        }

        function goToNextStep() {
            if (!currentCookRecipe) return;

            const totalSteps = currentCookRecipe.instructions.length;

            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderCookStep();
            } else {
                // Show completion screen
                showCookComplete();
            }
        }

        function goToPrevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderCookStep();
            }
        }

        function showCookComplete() {
            document.getElementById('cook-step-container').style.display = 'none';
            document.getElementById('cook-nav').style.display = 'none';
            document.getElementById('cook-complete').classList.add('active');
            document.getElementById('cook-complete-message').textContent =
                `Your ${currentCookRecipe.title} is ready to enjoy!`;
            document.getElementById('cook-progress-text').textContent = 'Complete!';
            document.getElementById('cook-progress-fill').style.width = '100%';
        }

        function toggleIngredient(idx) {
            if (checkedIngredients.has(idx)) {
                checkedIngredients.delete(idx);
            } else {
                checkedIngredients.add(idx);
            }
            renderCookIngredients();
        }

        function toggleIngredientsPanel() {
            document.getElementById('cook-ingredients-panel').classList.toggle('active');
        }

        // Cook Mode Event Listeners
        document.getElementById('start-cook-mode').addEventListener('click', () => {
            if (currentRecipeId) {
                startCookMode(currentRecipeId);
            }
        });

        document.getElementById('cook-exit-btn').addEventListener('click', closeCookMode);
        document.getElementById('cook-next-btn').addEventListener('click', goToNextStep);
        document.getElementById('cook-prev-btn').addEventListener('click', goToPrevStep);
        document.getElementById('cook-complete-btn').addEventListener('click', closeCookMode);
        document.getElementById('cook-ingredients-toggle').addEventListener('click', toggleIngredientsPanel);
        document.getElementById('cook-ingredients-close').addEventListener('click', toggleIngredientsPanel);

        document.getElementById('cook-ingredients-list').addEventListener('click', (e) => {
            const item = e.target.closest('.cook-ingredient-item');
            if (item) {
                toggleIngredient(parseInt(item.dataset.idx));
            }
        });

        // Keyboard navigation for cook mode
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('cook-overlay').classList.contains('active')) return;

            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                goToNextStep();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goToPrevStep();
            } else if (e.key === 'i' || e.key === 'I') {
                toggleIngredientsPanel();
            }
        });

        // ==================== VOICE FEATURES ====================

        // Voice state
        let voiceEnabled = false;
        let listeningEnabled = false;
        let recognition = null;
        let isSpeaking = false;

        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const speechSynthesis = window.speechSynthesis;
        const hasSpeechRecognition = !!SpeechRecognition;
        const hasSpeechSynthesis = !!speechSynthesis;

        // DOM elements for voice
        const micBtn = document.getElementById('voice-mic-btn');
        const speakerBtn = document.getElementById('voice-speaker-btn');
        const voiceCommandsPanel = document.getElementById('voice-commands-panel');

        // Initialize speech recognition
        function initSpeechRecognition() {
            if (!hasSpeechRecognition) {
                console.log('Speech recognition not supported');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript.toLowerCase().trim();
                console.log('Heard:', transcript);
                handleVoiceCommand(transcript);
            };

            recognition.onerror = (event) => {
                console.log('Speech recognition error:', event.error);
                if (event.error === 'no-speech' || event.error === 'audio-capture') {
                    // Restart if still listening
                    if (listeningEnabled) {
                        restartRecognition();
                    }
                }
            };

            recognition.onend = () => {
                // Restart if still supposed to be listening
                if (listeningEnabled) {
                    restartRecognition();
                }
            };
        }

        function restartRecognition() {
            if (recognition && listeningEnabled) {
                try {
                    recognition.start();
                } catch (e) {
                    // Already started, ignore
                }
            }
        }

        // Handle voice commands
        function handleVoiceCommand(transcript) {
            // Check for each command
            const commands = {
                'next': () => {
                    highlightCommand('next');
                    goToNextStep();
                },
                'back': () => {
                    highlightCommand('back');
                    goToPrevStep();
                },
                'previous': () => {
                    highlightCommand('back');
                    goToPrevStep();
                },
                'repeat': () => {
                    highlightCommand('repeat');
                    speakCurrentStep();
                },
                'ingredients': () => {
                    highlightCommand('ingredients');
                    toggleIngredientsPanel();
                }
            };

            // Find matching command
            for (const [keyword, action] of Object.entries(commands)) {
                if (transcript.includes(keyword)) {
                    action();
                    return;
                }
            }
        }

        // Highlight recognized command
        function highlightCommand(command) {
            const commandEl = document.querySelector(`.voice-command[data-command="${command}"]`);
            if (commandEl) {
                commandEl.classList.add('recognized');
                setTimeout(() => {
                    commandEl.classList.remove('recognized');
                }, 500);
            }
        }

        // Toggle listening
        function toggleListening() {
            if (!hasSpeechRecognition) {
                alert('Voice commands are not supported in this browser. Try Chrome, Edge, or Safari.');
                return;
            }

            listeningEnabled = !listeningEnabled;

            if (listeningEnabled) {
                if (!recognition) {
                    initSpeechRecognition();
                }
                try {
                    recognition.start();
                } catch (e) {
                    // Already started
                }
                micBtn.classList.add('listening');
                voiceCommandsPanel.classList.add('active');
            } else {
                if (recognition) {
                    recognition.stop();
                }
                micBtn.classList.remove('listening');
                voiceCommandsPanel.classList.remove('active');
            }
        }

        // Text-to-speech
        function speakText(text) {
            if (!hasSpeechSynthesis) return;

            // Cancel any ongoing speech
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;

            utterance.onstart = () => {
                isSpeaking = true;
                speakerBtn.classList.add('speaking');
            };

            utterance.onend = () => {
                isSpeaking = false;
                speakerBtn.classList.remove('speaking');
            };

            utterance.onerror = () => {
                isSpeaking = false;
                speakerBtn.classList.remove('speaking');
            };

            speechSynthesis.speak(utterance);
        }

        function speakCurrentStep() {
            if (!currentCookRecipe || !voiceEnabled) return;

            const stepText = currentCookRecipe.instructions[currentStep];
            const stepNumber = currentStep + 1;
            speakText(`Step ${stepNumber}. ${stepText}`);
        }

        // Toggle voice readout
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;

            if (voiceEnabled) {
                speakerBtn.classList.add('active');
                // Speak current step when enabled
                speakCurrentStep();
            } else {
                speakerBtn.classList.remove('active');
                // Stop any ongoing speech
                if (hasSpeechSynthesis) {
                    speechSynthesis.cancel();
                }
            }
        }

        // Event listeners for voice buttons
        micBtn.addEventListener('click', toggleListening);
        speakerBtn.addEventListener('click', toggleVoice);

        // Modify goToNextStep to speak
        const originalGoToNextStep = goToNextStep;
        goToNextStep = function() {
            originalGoToNextStep();
            // Speak after navigation if voice is enabled and not on complete screen
            if (voiceEnabled && currentCookRecipe && currentStep < currentCookRecipe.instructions.length) {
                speakCurrentStep();
            }
        };

        // Modify goToPrevStep to speak
        const originalGoToPrevStep = goToPrevStep;
        goToPrevStep = function() {
            originalGoToPrevStep();
            // Speak after navigation if voice is enabled
            if (voiceEnabled) {
                speakCurrentStep();
            }
        };

        // Clean up when closing cook mode
        const originalCloseCookMode = closeCookMode;
        closeCookMode = function() {
            // Stop listening
            if (listeningEnabled) {
                listeningEnabled = false;
                if (recognition) {
                    recognition.stop();
                }
                micBtn.classList.remove('listening');
                voiceCommandsPanel.classList.remove('active');
            }

            // Stop speaking
            if (hasSpeechSynthesis) {
                speechSynthesis.cancel();
            }
            voiceEnabled = false;
            speakerBtn.classList.remove('active');
            speakerBtn.classList.remove('speaking');

            originalCloseCookMode();
        };

        // Initial render
        renderFilters();
        renderRecipes();
    </script>
</body>
</html>
