<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <style>
        :root {
            --bg: #faf9f7;
            --card: #ffffff;
            --text: #2d2d2d;
            --text-light: #6b6b6b;
            --accent: #e07a5f;
            --accent-light: #f4d1c7;
            --border: #e8e6e3;
            --shadow: rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1.5rem 2rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Category Filter */
        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .filter-btn {
            padding: 0.5rem 1.25rem;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-light);
            font-size: 0.85rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: capitalize;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Recipe Grid */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .recipe-card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .recipe-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px var(--shadow);
        }

        .recipe-card:hover::before {
            transform: scaleX(1);
        }

        .recipe-card .category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .recipe-card h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .recipe-card .description {
            font-size: 0.85rem;
            color: var(--text-light);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 2rem 2rem 1rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 10;
        }

        .modal-header .category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .modal-header .description {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .modal-body {
            padding: 1.5rem 2rem 2rem;
        }

        .modal-body h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .ingredients-list {
            list-style: none;
            margin-bottom: 2rem;
        }

        .ingredients-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .ingredients-list li:last-child {
            border-bottom: none;
        }

        .instructions-list {
            list-style: none;
            counter-reset: step;
        }

        .instructions-list li {
            padding: 1rem 0;
            padding-left: 3rem;
            position: relative;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .instructions-list li:last-child {
            border-bottom: none;
        }

        .instructions-list li::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            top: 1rem;
            width: 2rem;
            height: 2rem;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .source-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg);
            color: var(--text-light);
            text-decoration: none;
            border-radius: 2rem;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .source-link:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .meta {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        /* Cook Mode Button */
        .cook-mode-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            margin-right: 0.75rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cook-mode-btn:hover {
            background: #c9684f;
            transform: scale(1.02);
        }

        .cook-mode-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Cook Mode Overlay */
        .cook-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cook-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cook-header {
            padding: 1.5rem 2rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .cook-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cook-exit-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .cook-exit-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .cook-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text);
        }

        .cook-progress {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cook-progress-text {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .cook-progress-bar {
            width: 120px;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .cook-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .cook-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cook-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        .cook-step-container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .cook-step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .cook-step-text {
            font-size: 1.75rem;
            line-height: 1.5;
            color: var(--text);
            font-weight: 400;
        }

        .cook-step-ingredients {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .cook-step-ingredients h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .cook-step-ingredients p {
            font-size: 1rem;
            color: var(--text-light);
            line-height: 1.6;
        }

        .cook-nav {
            padding: 1.5rem 2rem;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .cook-nav-btn {
            padding: 1rem 2rem;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            font-weight: 500;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cook-nav-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .cook-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cook-nav-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .cook-nav-btn.primary:hover:not(:disabled) {
            background: #c9684f;
            border-color: #c9684f;
            color: white;
        }

        .cook-nav-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Ingredients Panel (toggleable) */
        .cook-ingredients-toggle {
            position: fixed;
            bottom: 7rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border: none;
            background: var(--card);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text);
            transition: all 0.2s ease;
            z-index: 10;
            border: 1px solid var(--border);
        }

        .cook-ingredients-toggle:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .cook-ingredients-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100%;
            background: var(--card);
            border-left: 1px solid var(--border);
            z-index: 2001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cook-ingredients-panel.active {
            right: 0;
        }

        .cook-ingredients-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cook-ingredients-header h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
        }

        .cook-ingredients-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .cook-ingredients-close:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .cook-ingredients-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.5rem;
        }

        .cook-ingredient-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .cook-ingredient-item:last-child {
            border-bottom: none;
        }

        .cook-ingredient-item.checked {
            opacity: 0.5;
        }

        .cook-ingredient-item.checked span {
            text-decoration: line-through;
        }

        .cook-ingredient-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-top: 1px;
        }

        .cook-ingredient-item.checked .cook-ingredient-checkbox {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .cook-ingredient-item span {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.4;
        }

        /* Complete screen */
        .cook-complete {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .cook-complete.active {
            display: flex;
        }

        .cook-complete-icon {
            width: 6rem;
            height: 6rem;
            background: #d4edda;
            color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 2rem;
        }

        .cook-complete h2 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        .cook-complete p {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .cook-complete-btn {
            padding: 1rem 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cook-complete-btn:hover {
            background: #c9684f;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.5rem;
            }

            .modal {
                max-height: 90vh;
                border-radius: 16px 16px 0 0;
            }

            .modal-header, .modal-body {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }

            .cook-header {
                padding: 1rem 1.25rem;
                flex-wrap: wrap;
                gap: 0.75rem;
            }

            .cook-title {
                font-size: 0.95rem;
            }

            .cook-progress-bar {
                width: 80px;
            }

            .cook-step-number {
                width: 3rem;
                height: 3rem;
                font-size: 1.25rem;
                margin-bottom: 1.5rem;
            }

            .cook-step-text {
                font-size: 1.35rem;
            }

            .cook-nav {
                padding: 1rem 1.25rem;
            }

            .cook-nav-btn {
                padding: 0.875rem 1.5rem;
                font-size: 0.9rem;
            }

            .cook-ingredients-panel {
                width: 100%;
                right: -100%;
            }

            .cook-ingredients-toggle {
                bottom: 6.5rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Recipe Book</h1>
        <p>Simple recipes for everyday cooking</p>
    </header>

    <div class="container">
        <div class="filters" id="filters"></div>
        <div class="recipes-grid" id="recipes-grid"></div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <button class="close-btn" id="close-btn">&times;</button>
                <div class="category" id="modal-category"></div>
                <h2 id="modal-title"></h2>
                <p class="description" id="modal-description"></p>
            </div>
            <div class="modal-body">
                <h3>Ingredients</h3>
                <ul class="ingredients-list" id="modal-ingredients"></ul>

                <h3>Instructions</h3>
                <ol class="instructions-list" id="modal-instructions"></ol>

                <div class="meta" id="modal-meta"></div>
                <button class="cook-mode-btn" id="start-cook-mode">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Start Cook Mode
                </button>
                <a class="source-link" id="modal-source" href="#" target="_blank">View Original Recipe</a>
            </div>
        </div>
    </div>

    <!-- Cook Mode Overlay -->
    <div class="cook-overlay" id="cook-overlay">
        <div class="cook-header">
            <div class="cook-header-left">
                <button class="cook-exit-btn" id="cook-exit-btn">&times;</button>
                <span class="cook-title" id="cook-recipe-title"></span>
            </div>
            <div class="cook-progress">
                <span class="cook-progress-text" id="cook-progress-text">Step 1 of 5</span>
                <div class="cook-progress-bar">
                    <div class="cook-progress-fill" id="cook-progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="cook-body">
            <div class="cook-main" id="cook-main">
                <div class="cook-step-container" id="cook-step-container">
                    <div class="cook-step-number" id="cook-step-number">1</div>
                    <p class="cook-step-text" id="cook-step-text"></p>
                </div>

                <div class="cook-complete" id="cook-complete">
                    <div class="cook-complete-icon">&#10003;</div>
                    <h2>All Done!</h2>
                    <p id="cook-complete-message">Your dish is ready to enjoy.</p>
                    <button class="cook-complete-btn" id="cook-complete-btn">Back to Recipe</button>
                </div>
            </div>

            <button class="cook-ingredients-toggle" id="cook-ingredients-toggle" title="View Ingredients">
                &#9776;
            </button>
        </div>

        <div class="cook-nav" id="cook-nav">
            <button class="cook-nav-btn" id="cook-prev-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                Previous
            </button>
            <button class="cook-nav-btn primary" id="cook-next-btn">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <!-- Ingredients Panel -->
        <div class="cook-ingredients-panel" id="cook-ingredients-panel">
            <div class="cook-ingredients-header">
                <h3>Ingredients</h3>
                <button class="cook-ingredients-close" id="cook-ingredients-close">&times;</button>
            </div>
            <div class="cook-ingredients-list" id="cook-ingredients-list"></div>
        </div>
    </div>

    <script>
        const recipes = [
            {
                id: 1,
                title: "Banana Chocolate Pecan Muffins",
                category: "breakfast",
                description: "Fluffy, 1-bowl vegan + gluten-free banana muffins generously studded with pecans and chocolate chips. Perfect for a lazy weekend breakfast or take-along snack!",
                ingredients: [
                    "2 Tbsp flaxseed meal",
                    "1/4 cup water",
                    "2 medium ripe bananas",
                    "1/2 cup maple syrup",

        // Get unique categories
        const categories = ['all', ...new Set(recipes.map(r => r.category))];
        let activeCategory = 'all';

        // Render filters
        function renderFilters() {
            const filtersEl = document.getElementById('filters');
            filtersEl.innerHTML = categories.map(cat =>
                `<button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">${cat}</button>`
            ).join('');
        }

        // Render recipes
        function renderRecipes() {
            const gridEl = document.getElementById('recipes-grid');
            const filtered = activeCategory === 'all'
                ? recipes
                : recipes.filter(r => r.category === activeCategory);

            if (filtered.length === 0) {
                gridEl.innerHTML = '<div class="empty-state">No recipes found in this category.</div>';
                return;
            }

            gridEl.innerHTML = filtered.map(recipe => `
                <div class="recipe-card" data-id="${recipe.id}">
                    <div class="category">${recipe.category}</div>
                    <h3>${recipe.title}</h3>
                    <p class="description">${recipe.description}</p>
                </div>
            `).join('');
        }

        // Open modal
        function openModal(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            document.getElementById('modal-category').textContent = recipe.category;
            document.getElementById('modal-title').textContent = recipe.title;
            document.getElementById('modal-description').textContent = recipe.description;

            document.getElementById('modal-ingredients').innerHTML =
                recipe.ingredients.map(ing => `<li>${ing}</li>`).join('');

            document.getElementById('modal-instructions').innerHTML =
                recipe.instructions.map(inst => `<li>${inst}</li>`).join('');

            document.getElementById('modal-meta').textContent = recipe.meta;
            document.getElementById('modal-source').href = recipe.source;

            document.getElementById('modal-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Event listeners
        document.getElementById('filters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                activeCategory = e.target.dataset.category;
                renderFilters();
                renderRecipes();
            }
        });

        document.getElementById('recipes-grid').addEventListener('click', (e) => {
            const card = e.target.closest('.recipe-card');
            if (card) {
                openModal(parseInt(card.dataset.id));
            }
        });

        document.getElementById('close-btn').addEventListener('click', closeModal);
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('cook-overlay').classList.contains('active')) {
                    closeCookMode();
                } else {
                    closeModal();
                }
            }
        });

        // ==================== COOK MODE ====================
        let currentCookRecipe = null;
        let currentStep = 0;
        let checkedIngredients = new Set();

        function startCookMode(recipeId) {
            currentCookRecipe = recipes.find(r => r.id === recipeId);
            if (!currentCookRecipe) return;

            currentStep = 0;
            checkedIngredients.clear();

            // Close the recipe modal
            closeModal();

            // Set up the cook mode UI
            document.getElementById('cook-recipe-title').textContent = currentCookRecipe.title;
            renderCookStep();
            renderCookIngredients();

            // Show cook overlay
            document.getElementById('cook-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Hide complete screen, show steps
            document.getElementById('cook-complete').classList.remove('active');
            document.getElementById('cook-step-container').style.display = 'block';
            document.getElementById('cook-nav').style.display = 'flex';
        }

        function closeCookMode() {
            document.getElementById('cook-overlay').classList.remove('active');
            document.getElementById('cook-ingredients-panel').classList.remove('active');
            document.body.style.overflow = '';
            currentCookRecipe = null;
            currentStep = 0;
        }

        function renderCookStep() {
            if (!currentCookRecipe) return;

            const totalSteps = currentCookRecipe.instructions.length;
            const stepText = currentCookRecipe.instructions[currentStep];

            // Update step display
            document.getElementById('cook-step-number').textContent = currentStep + 1;
            document.getElementById('cook-step-text').textContent = stepText;

            // Update progress
            document.getElementById('cook-progress-text').textContent = `Step ${currentStep + 1} of ${totalSteps}`;
            const progressPercent = ((currentStep + 1) / totalSteps) * 100;
            document.getElementById('cook-progress-fill').style.width = `${progressPercent}%`;

            // Update nav buttons
            document.getElementById('cook-prev-btn').disabled = currentStep === 0;

            const nextBtn = document.getElementById('cook-next-btn');
            if (currentStep === totalSteps - 1) {
                nextBtn.innerHTML = `
                    Finish
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                `;
            } else {
                nextBtn.innerHTML = `
                    Next
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                `;
            }
        }

        function renderCookIngredients() {
            if (!currentCookRecipe) return;

            const listEl = document.getElementById('cook-ingredients-list');
            listEl.innerHTML = currentCookRecipe.ingredients.map((ing, idx) => `
                <div class="cook-ingredient-item ${checkedIngredients.has(idx) ? 'checked' : ''}" data-idx="${idx}">
                    <div class="cook-ingredient-checkbox">
                        ${checkedIngredients.has(idx) ? '&#10003;' : ''}
                    </div>
                    <span>${ing}</span>
                </div>
            `).join('');
        }

        function goToNextStep() {
            if (!currentCookRecipe) return;

            const totalSteps = currentCookRecipe.instructions.length;

            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderCookStep();
            } else {
                // Show completion screen
                showCookComplete();
            }
        }

        function goToPrevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderCookStep();
            }
        }

        function showCookComplete() {
            document.getElementById('cook-step-container').style.display = 'none';
            document.getElementById('cook-nav').style.display = 'none';
            document.getElementById('cook-complete').classList.add('active');
            document.getElementById('cook-complete-message').textContent =
                `Your ${currentCookRecipe.title} is ready to enjoy!`;
            document.getElementById('cook-progress-text').textContent = 'Complete!';
            document.getElementById('cook-progress-fill').style.width = '100%';
        }

        function toggleIngredient(idx) {
            if (checkedIngredients.has(idx)) {
                checkedIngredients.delete(idx);
            } else {
                checkedIngredients.add(idx);
            }
            renderCookIngredients();
        }

        function toggleIngredientsPanel() {
            document.getElementById('cook-ingredients-panel').classList.toggle('active');
        }

        // Cook Mode Event Listeners
        document.getElementById('start-cook-mode').addEventListener('click', () => {
            const recipeId = parseInt(document.querySelector('.recipe-card[data-id]')?.dataset.id) ||
                             parseInt(document.getElementById('modal-title').textContent &&
                             recipes.find(r => r.title === document.getElementById('modal-title').textContent)?.id);

            // Find recipe by title shown in modal
            const title = document.getElementById('modal-title').textContent;
            const recipe = recipes.find(r => r.title === title);
            if (recipe) {
                startCookMode(recipe.id);
            }
        });

        document.getElementById('cook-exit-btn').addEventListener('click', closeCookMode);
        document.getElementById('cook-next-btn').addEventListener('click', goToNextStep);
        document.getElementById('cook-prev-btn').addEventListener('click', goToPrevStep);
        document.getElementById('cook-complete-btn').addEventListener('click', closeCookMode);
        document.getElementById('cook-ingredients-toggle').addEventListener('click', toggleIngredientsPanel);
        document.getElementById('cook-ingredients-close').addEventListener('click', toggleIngredientsPanel);

        document.getElementById('cook-ingredients-list').addEventListener('click', (e) => {
            const item = e.target.closest('.cook-ingredient-item');
            if (item) {
                toggleIngredient(parseInt(item.dataset.idx));
            }
        });

        // Keyboard navigation for cook mode
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('cook-overlay').classList.contains('active')) return;

            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                goToNextStep();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goToPrevStep();
            } else if (e.key === 'i' || e.key === 'I') {
                toggleIngredientsPanel();
            }
        });

        // Initial render
        renderFilters();
        renderRecipes();
    </script>
</body>
</html>
