title: Grillable Veggie Burgers
category: hot meals
image: images/veggie-burgers.jpg
description: Hearty black bean walnut patties with smoky spices. Holds up on the grill.
meta: "Yield: 5 burgers | Prep: 25 min | Cook: 10 min"
source: https://minimalistbaker.com/easy-grillable-veggie-burgers/

steps:
  brown rice:
    with:
      - 1 cup brown rice
      - 2 cups water
    do: simmer
    for: 45 min
    until: tender
    duration: 45 min

  toasted walnuts:
    with:
      - 1 cup raw walnuts
    do: bake at 350F
    for: 5-7 min
    until: fragrant
    duration: 7 min

  sauteed onion:
    with:
      - 1/2 medium white onion, diced
      - 1/2 Tbsp avocado oil
    do: saute
    for: 3-4 min
    until: translucent
    duration: 4 min

  walnut spice mixture:
    with:
      - "@toasted walnuts"
      - 1 Tbsp chili powder
      - 1 Tbsp cumin
      - 1 Tbsp smoked paprika
      - 1/2 tsp sea salt
      - 1/2 tsp black pepper
      - 1 Tbsp coconut sugar
    do: blend
    until: fine meal
    duration: 1 min

  mashed beans:
    with:
      - 1 1/2 cups cooked black beans
    do: mash
    until: mostly smooth with some chunks
    duration: 3 min

  burger mixture:
    with:
      - "@brown rice"
      - "@walnut spice mixture"
      - "@sauteed onion"
      - "@mashed beans"
      - 1/3 cup panko bread crumbs
      - 3-4 Tbsp vegan BBQ sauce
    do: mix
    for: 1-2 min
    until: moldable
    duration: 3 min

  patties:
    with:
      - "@burger mixture"
    do: form into 5 patties
    until: 1/2 cup each, firmly packed
    duration: 5 min

  cook:
    with:
      - "@patties"
      - 1 Tbsp avocado oil
    do: grill or pan-fry
    for: 3-4 min per side
    until: browned and heated through
    duration: 8 min
