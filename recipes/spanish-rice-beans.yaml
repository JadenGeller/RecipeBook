title: Spanish Rice and Beans
category: hot meals
image: images/spanish-rice-beans.jpg
description: Tomato-spiced rice with black beans and corn. One pot.
meta: "Yield: 4 servings | Prep: 15 min | Cook: 20 min"
source: https://elavegan.com/spanish-rice-and-beans/

steps:
  soaked rice:
    with:
      - 1 1/2 cups white rice, uncooked
      - 3 cups water
    do: soak
    for: 10-30 min
    until: drained
    duration: 30 min

  sauteed aromatics:
    with:
      - 1 Tbsp oil
      - 1 medium onion, diced
      - 1 medium red bell pepper, chopped
      - 3-4 garlic cloves, minced
      - 1 tsp ground cumin
      - 1 tsp sweet paprika
      - 1 tsp dried oregano
      - 1/2 tsp smoked paprika
      - 1 pinch red pepper flakes
      - 1/2 tsp salt and black pepper
    do: saute
    duration: 5 min
    sequence:
      - with:
          - 1 Tbsp oil
          - 1 medium onion, diced
          - 1 medium red bell pepper, chopped
        for: 3 min
      - add:
          - 3-4 garlic cloves, minced
          - 1 tsp ground cumin
          - 1 tsp sweet paprika
          - 1 tsp dried oregano
          - 1/2 tsp smoked paprika
          - 1 pinch red pepper flakes
          - 1/2 tsp salt and black pepper
        for: 1 min

  simmered rice:
    with:
      - "@soaked rice"
      - "@sauteed aromatics"
      - 1 1/4 cups vegetable broth
      - 1 1/4 cups salsa
    do: simmer
    for: 15-20 min
    until: rice is cooked
    duration: 20 min
    sequence:
      - with:
          - "@soaked rice"
          - 1 1/4 cups salsa
          - 1 1/4 cups vegetable broth
        until: boiling
      - do: cover and simmer
        for: 15-20 min
        until: rice is cooked

  finished dish:
    with:
      - "@simmered rice"
      - 1 (15 oz) can kidney beans, drained and rinsed
      - 1/2 cup green olives, halved (optional)
      - 2 Tbsp fresh cilantro or parsley for garnish
    do: fold in
    until: combined
    duration: 2 min
