title: 30-Minute Tempeh Stir-Fry
category: dinner
image: images/tempeh-stir-fry.jpg
description: A hearty tempeh stir fry with BIG flavor! Perfect for weeknight dinners.
meta: "Yield: 4 servings | Prep: 20 min | Cook: 10 min"
source: https://minimalistbaker.com/simple-vegetable-tempeh-stir-fry/

steps:
  glaze:
    in:
      - 4 Tbsp peanut butter
      - 4 tsp sesame oil
      - 1/3 cup coconut aminos
      - 4 tsp lime juice
      - 3 tsp ginger, grated
      - 1 tsp maple syrup
      - 4 Tbsp water
    techniques: [whisk]
    do: whisk until smooth and pourable

  marinated tempeh:
    in:
      - 8 oz tempeh, cubed
      - glaze
    techniques: [coat, refrigerate]
    do: coat tempeh in glaze, refrigerate 15 min

  cooked tempeh:
    in:
      - marinated tempeh
      - 4 tsp sesame oil
    techniques: [sauté]
    do: heat skillet, sauté 3-4 min per side until browned

  vegetables:
    in:
      - 2/3 cup green onions, chopped
      - 4 cups mixed vegetables
      - 4 tsp coconut aminos
    techniques: [sauté]
    do: sauté until tender, 4-5 min

  dish:
    in:
      - cooked tempeh
      - vegetables
      - glaze
      - 3 cups quinoa
    techniques: [combine, serve]
    do: combine everything, serve over grains
