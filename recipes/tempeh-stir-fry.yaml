title: 30-Minute Tempeh Stir-Fry
category: dinner
image: images/tempeh-stir-fry.jpg
description: A hearty tempeh stir fry with BIG flavor! Perfect for weeknight dinners.
meta: "Yield: 4 servings | Prep: 20 min | Cook: 10 min"
source: https://minimalistbaker.com/simple-vegetable-tempeh-stir-fry/

steps:
  glaze:
    with:
      - 4 Tbsp peanut butter
      - 4 tsp sesame oil
      - 1/3 cup coconut aminos
      - 4 tsp lime juice
      - 3 tsp ginger, grated
      - 1 tsp maple syrup
      - 4 Tbsp water
    do: whisk
    until: smooth

  marinated tempeh:
    with:
      - 8 oz tempeh, cubed
      - glaze
    do: marinate
    for: 15 min

  cooked tempeh:
    with:
      - marinated tempeh
      - 4 tsp sesame oil
    do: sauté
    for: 3-4 min per side
    until: browned

  vegetables:
    with:
      - 2/3 cup green onions, chopped
      - 4 cups mixed vegetables
      - 4 tsp coconut aminos
    do: sauté
    for: 4-5 min
    until: tender

  dish:
    with:
      - cooked tempeh
      - vegetables
      - glaze
      - 3 cups quinoa
    do: serve
