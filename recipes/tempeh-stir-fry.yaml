title: Tempeh Stir-Fry
category: dinner
image: images/tempeh-stir-fry.jpg
description: Peanut-ginger glaze over crispy tempeh. Works with any vegetables and grains you have.
meta: "Yield: 4 servings | Prep: 20 min | Cook: 10 min"
source: https://minimalistbaker.com/simple-vegetable-tempeh-stir-fry/

steps:
  quinoa:
    with:
      - 1 cup quinoa
      - 2 cups water
    do: simmer
    for: 15 min
    until: fluffy

  glaze:
    with:
      - 4 Tbsp peanut butter
      - 4 tsp sesame oil
      - 1/3 cup coconut aminos
      - 4 tsp lime juice
      - 3 tsp ginger, grated
      - 1 tsp maple syrup
      - 4 Tbsp water
    do: whisk
    until: smooth

  marinated tempeh:
    with:
      - 8 oz tempeh, cubed
      - glaze
    do: marinate
    for: 15 min

  stir-fry:
    do: sauté
    sequence:
      - with:
          - marinated tempeh
          - 4 tsp sesame oil
        for: 3-4 min per side
        until: browned
      - add:
          - 2/3 cup green onions, chopped
          - 4 cups mixed vegetables
          - 4 tsp coconut aminos
        for: 4-5 min
        until: tender
      - add:
          - quinoa
          - glaze
