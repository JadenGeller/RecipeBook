title: Creamy Lentil Vegetable Soup
category: hot meals
image: images/creamy-lentil-soup.jpg
description: Red lentils blended into a creamy base with carrots, celery, and warm spices.
meta: "Yield: 4 servings | Prep: 15 min | Cook: 40 min"
source: https://www.budgetbytes.com/creamy-lentil-vegetable-soup/

steps:
  sautéed mushrooms:
    with:
      - 16 oz mushrooms, sliced
      - 2 Tbsp cooking oil
      - 1 pinch salt
      - 1 pinch pepper
    do: sauté
    until: water released and evaporated
    duration: 8 min

  aromatics:
    with:
      - "@sautéed mushrooms"
      - 3 medium carrots, diced
      - 3 ribs celery, diced
      - 1 yellow onion, diced
      - 2 cloves garlic, minced
      - 1/2 tsp dried thyme
      - 1/2 tsp rubbed sage
      - 1/2 tsp dried rosemary
    do: sauté
    until: onions soft and translucent
    duration: 7 min

  lentil soup:
    with:
      - "@aromatics"
      - 1 cup brown lentils
      - 3 cups vegetable broth
    do: simmer
    for: 20 min
    until: lentils tender
    duration: 20 min

  creamy soup:
    with:
      - "@lentil soup"
      - 1 (13.5 oz) can full-fat coconut milk
      - 1/2 tsp salt
      - 1/4 tsp pepper
    do: simmer
    for: 5 min
    until: heated through
    duration: 5 min
